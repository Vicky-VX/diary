// 画布元素
// ═══════════════════════════════════════════════
function addToCanvas(src,w,h,left,top){
  // 先加载图片获取真实宽高比，避免白色 letterbox
  const probe=new Image();
  probe.onload=()=>{
    const nat=probe.naturalWidth/probe.naturalHeight;
    const maxSz=Math.min(CC.offsetWidth,CC.offsetHeight)*0.48;
    const fw=w||(nat>=1?maxSz:maxSz*nat);
    const fh=h||(nat>=1?maxSz/nat:maxSz);
    _placeOnCanvas(src,fw,fh,left,top);
  };
  probe.src=src;
}
function _placeOnCanvas(src,w,h,left,top,rot,zi,locked){
  if(zi){pCount=Math.max(pCount,zi);}else{pCount++;}
  const el=document.createElement('div');el.className='pi';el.dataset.src=src;el.dataset.rot=rot||'0';
  el.style.width=w+'px';el.style.height=h+'px';
  el.style.left=(left!==undefined?left:CC.offsetWidth/2-w/2)+'px';
  el.style.top=(top!==undefined?top:CC.offsetHeight/2-h/2)+'px';
  el.style.zIndex=zi||pCount;el.style.transformOrigin='center center';
  if(rot)el.style.transform='rotate('+rot+'deg)';
  const img=document.createElement('img');img.src=src;el.appendChild(img);

  // 删除按钮（始终显示，move模式下点击，draw模式下通过DC触摸路由处理）
  const db=document.createElement('button');db.className='dbtn';db.textContent='×';
  db.addEventListener('pointerdown',e=>{e.stopPropagation();el.remove();});el.appendChild(db);

  // 锁定按钮（选中时显示）
  const lb=document.createElement('button');lb.className='lock-btn';
  lb.addEventListener('pointerdown',e=>{
    e.stopPropagation();
    el.classList.toggle('locked');
    lb.textContent=el.classList.contains('locked')?'🔒':'🔓';
  });el.appendChild(lb);
  if(locked){el.classList.add('locked');lb.textContent='🔒';}else{lb.textContent='🔓';}

  // 图层按钮（选中时显示）
  const lr=document.createElement('div');lr.className='layer-row';
  const btnTop=document.createElement('button');btnTop.className='lbtn';btnTop.textContent='上移';
  btnTop.addEventListener('pointerdown',e=>{
    e.stopPropagation();
    const all=Array.from(document.querySelectorAll('.pi'));
    const myZ=parseInt(el.style.zIndex)||1;
    const above=all.filter(o=>o!==el&&(parseInt(o.style.zIndex)||1)>myZ)
      .sort((a,b)=>(parseInt(a.style.zIndex)||1)-(parseInt(b.style.zIndex)||1));
    if(above.length){const tgt=above[0];const tz=parseInt(tgt.style.zIndex)||1;tgt.style.zIndex=myZ;el.style.zIndex=tz;}
    else{el.style.zIndex=++pCount;}
  });
  const btnBot=document.createElement('button');btnBot.className='lbtn';btnBot.textContent='下移';
  btnBot.addEventListener('pointerdown',e=>{
    e.stopPropagation();
    const all=Array.from(document.querySelectorAll('.pi'));
    const myZ=parseInt(el.style.zIndex)||1;
    const below=all.filter(o=>o!==el&&(parseInt(o.style.zIndex)||1)<myZ)
      .sort((a,b)=>(parseInt(b.style.zIndex)||1)-(parseInt(a.style.zIndex)||1));
    if(below.length){const tgt=below[0];const tz=parseInt(tgt.style.zIndex)||1;tgt.style.zIndex=myZ;el.style.zIndex=tz;}
  });
  lr.appendChild(btnTop);lr.appendChild(btnBot);el.appendChild(lr);

  ['nw','ne','se','sw'].forEach(c=>{const h=document.createElement('div');h.className='handle h-'+c;h.addEventListener('pointerdown',e=>startResize(e,el,c));el.appendChild(h);});
  const rh=document.createElement('div');rh.className='handle h-rot';rh.textContent='↻';rh.addEventListener('pointerdown',e=>startRotate(e,el));el.appendChild(rh);

  el.addEventListener('pointerdown',e=>{
    if(mode!=='move')return;
    if(e.target.classList.contains('handle')||e.target===db||e.target===lb||e.target.closest('.layer-row'))return;
    if(el.classList.contains('locked'))return;
    e.stopPropagation();deselAll();el.classList.add('sel');el.style.zIndex=++pCount;startDrag(e,el);
  });
  CC.insertBefore(el,DC);
}

// 在 DC 画布上命中测试：tap 到某个 .pi 的删除按钮区域（右上角±24px）
function _piDeleteHitTest(p){
  for(const pi of document.querySelectorAll('.pi')){
    const l=parseFloat(pi.style.left)||0,t=parseFloat(pi.style.top)||0,w=parseFloat(pi.style.width)||100;
    if(Math.hypot(p.x-(l+w),p.y-t)<24){pi.remove();return true;}
  }
  return false;
}

// 双指捏合缩放状态
let _pinchEl=null,_pinchDist=0,_pinchW=0,_pinchH=0;
function deselAll(){document.querySelectorAll('.pi,.ti').forEach(e=>e.classList.remove('sel'));}
CC.addEventListener('pointerdown',e=>{if((mode==='move'||mode==='text')&&(e.target===CC||e.target===DC))deselAll();});
CC.addEventListener('pointerup',e=>{
  if(mode!=='text')return;
  if(e.target!==CC&&e.target!==DC)return;
  const rect=CC.getBoundingClientRect();
  _placeTextOnCanvas('',e.clientX-rect.left-30,e.clientY-rect.top-txtSz/2,txtSz,color);
});
// ── 文字工具 ──
let txtSz=20;
function chgTxtSz(d){
  txtSz=Math.min(72,Math.max(10,txtSz+d));
  document.getElementById('txt-sz-val').textContent=txtSz;
}

function _placeTextOnCanvas(text,left,top,fontSize,textColor,rot,zi){
  if(zi){pCount=Math.max(pCount,zi);}else{pCount++;}
  const el=document.createElement('div');
  el.className='ti';
  el.dataset.rot=rot||'0';
  el.dataset.fontSize=fontSize||txtSz;
  el.dataset.color=textColor||color;
  el.style.left=(left!==undefined?left:CC.offsetWidth/2-40)+'px';
  el.style.top=(top!==undefined?top:CC.offsetHeight/2-12)+'px';
  el.style.zIndex=zi||pCount;
  el.style.transformOrigin='center center';
  if(rot)el.style.transform='rotate('+rot+'deg)';

  const txt=document.createElement('div');
  txt.className='ti-text';
  txt.style.fontSize=(fontSize||txtSz)+'px';
  txt.style.color=textColor||color;
  txt.contentEditable='false';
  txt.textContent=text||'';
  txt.addEventListener('pointerdown',e=>e.stopPropagation());
  el.appendChild(txt);

  const db=document.createElement('button');db.className='dbtn';db.textContent='×';
  db.addEventListener('pointerdown',e=>{e.stopPropagation();el.remove();});
  el.appendChild(db);

  ['nw','ne','se','sw'].forEach(c=>{
    const h=document.createElement('div');h.className='handle h-'+c;
    h.addEventListener('pointerdown',e=>startResize(e,el,c));el.appendChild(h);
  });
  const rh=document.createElement('div');rh.className='handle h-rot';rh.textContent='↻';
  rh.addEventListener('pointerdown',e=>startRotate(e,el));el.appendChild(rh);

  el.addEventListener('pointerdown',e=>{
    if(e.target===txt){
      // 双击或在文字模式下单击可编辑
      if(mode==='text'||e.detail>=2){
        txt.contentEditable='true';
        setTimeout(()=>txt.focus(),30);
      }
      return;
    }
    if(e.target.classList.contains('handle')||e.target===db)return;
    if(mode!=='move'&&mode!=='text')return;
    e.stopPropagation();
    deselAll();el.classList.add('sel');el.style.zIndex=++pCount;
    if(e.target!==txt)startDrag(e,el);
  });

  txt.addEventListener('blur',()=>{
    txt.contentEditable='false';
    if(!txt.textContent.trim())el.remove();
  });

  CC.insertBefore(el,DC);
  if(!text){
    setTimeout(()=>{txt.contentEditable='true';txt.focus();},60);
  }
  document.getElementById('ph').style.display='none';
}

function startDrag(e,el){const sx=e.clientX,sy=e.clientY,ol=parseInt(el.style.left)||0,ot=parseInt(el.style.top)||0;const mm=ev=>{el.style.left=(ol+ev.clientX-sx)+'px';el.style.top=(ot+ev.clientY-sy)+'px';};const mu=()=>{window.removeEventListener('pointermove',mm);window.removeEventListener('pointerup',mu);};window.addEventListener('pointermove',mm);window.addEventListener('pointerup',mu);}
function startResize(e,el,corner){e.stopPropagation();e.preventDefault();const sx=e.clientX,ow=parseInt(el.style.width)||el.offsetWidth,oh=parseInt(el.style.height)||el.offsetHeight,ol=parseInt(el.style.left)||0,ot=parseInt(el.style.top)||0,asp=ow/oh;const mm=ev=>{const dx=ev.clientX-sx;let nw=ow,nh=oh,nl=ol,nt=ot;if(corner==='se'){nw=Math.max(40,ow+dx);nh=nw/asp;}if(corner==='sw'){nw=Math.max(40,ow-dx);nh=nw/asp;nl=ol+ow-nw;}if(corner==='ne'){nw=Math.max(40,ow+dx);nh=nw/asp;nt=ot+oh-nh;}if(corner==='nw'){nw=Math.max(40,ow-dx);nh=nw/asp;nl=ol+ow-nw;nt=ot+oh-nh;}el.style.width=nw+'px';el.style.height=nh+'px';el.style.left=nl+'px';el.style.top=nt+'px';};const mu=()=>{window.removeEventListener('pointermove',mm);window.removeEventListener('pointerup',mu);};window.addEventListener('pointermove',mm);window.addEventListener('pointerup',mu);}
function startRotate(e,el){e.stopPropagation();e.preventDefault();const rect=el.getBoundingClientRect(),cx=rect.left+rect.width/2,cy=rect.top+rect.height/2,sa=Math.atan2(e.clientY-cy,e.clientX-cx),sr=parseFloat(el.dataset.rot)||0;const mm=ev=>{const a=Math.atan2(ev.clientY-cy,ev.clientX-cx),deg=sr+(a-sa)*(180/Math.PI);el.dataset.rot=deg;el.style.transform='rotate('+deg+'deg)';};const mu=()=>{window.removeEventListener('pointermove',mm);window.removeEventListener('pointerup',mu);};window.addEventListener('pointermove',mm);window.addEventListener('pointerup',mu);}

// ═══════════════════════════════════════════════
// 裁剪系统（手绘套索，松手自动闭合）
// ═══════════════════════════════════════════════
const cropOv=document.getElementById('crop-ov'),cSrc=document.getElementById('csrc'),cCanvas=document.getElementById('ccanvas'),cCtx=cCanvas.getContext('2d'),chint=document.getElementById('chint');
let cropPath=[],cropDrawing=false,cropClosed=false,cropTrayItem=null;

function startCrop(src,trayItem){
  cropTrayItem=trayItem;cSrc.src=src;
  cCanvas.width=window.innerWidth;
  cCanvas.height=window.innerHeight-90;
  cropOv.classList.add('on');
  clearCropPath();
}
function exitCrop(){cropOv.classList.remove('on');cropPath=[];cropDrawing=false;cropClosed=false;cropTrayItem=null;}
function clearCropPath(){cropPath=[];cropDrawing=false;cropClosed=false;cCtx.clearRect(0,0,cCanvas.width,cCanvas.height);chint.textContent='按住拖动圈出选区，松手自动闭合';}

function getCPos(e){
  const r=cCanvas.getBoundingClientRect();
  const s=e.changedTouches?e.changedTouches[0]:e.touches?e.touches[0]:e;
  return{x:s.clientX-r.left,y:s.clientY-r.top};
}

// 画线时只显示笔迹（白色线条，不填充）
function drawStroke(){
  cCtx.clearRect(0,0,cCanvas.width,cCanvas.height);
  if(cropPath.length<2)return;
  cCtx.save();
  cCtx.strokeStyle='rgba(255,255,255,0.9)';
  cCtx.lineWidth=2.5;cCtx.lineCap='round';cCtx.lineJoin='round';
  cCtx.beginPath();
  cCtx.moveTo(cropPath[0].x,cropPath[0].y);
  // 平滑曲线（catmull-rom 简化版）
  for(let i=1;i<cropPath.length-1;i++){
    const mx=(cropPath[i].x+cropPath[i+1].x)/2;
    const my=(cropPath[i].y+cropPath[i+1].y)/2;
    cCtx.quadraticCurveTo(cropPath[i].x,cropPath[i].y,mx,my);
  }
  cCtx.lineTo(cropPath[cropPath.length-1].x,cropPath[cropPath.length-1].y);
  cCtx.stroke();cCtx.restore();
}

// 松手后显示选区遮罩（镂空高亮）
function drawSelectionOverlay(){
  cCtx.clearRect(0,0,cCanvas.width,cCanvas.height);
  if(cropPath.length<3)return;
  // 暗色蒙版
  cCtx.save();
  cCtx.fillStyle='rgba(0,0,0,0.52)';
  cCtx.fillRect(0,0,cCanvas.width,cCanvas.height);
  // 镂空选区
  cCtx.globalCompositeOperation='destination-out';
  cCtx.beginPath();
  cCtx.moveTo(cropPath[0].x,cropPath[0].y);
  for(let i=1;i<cropPath.length-1;i++){
    const mx=(cropPath[i].x+cropPath[i+1].x)/2;
    const my=(cropPath[i].y+cropPath[i+1].y)/2;
    cCtx.quadraticCurveTo(cropPath[i].x,cropPath[i].y,mx,my);
  }
  cCtx.closePath();cCtx.fill();cCtx.restore();
  // 白色虚线描边
  cCtx.strokeStyle='rgba(255,255,255,0.85)';
  cCtx.lineWidth=2;cCtx.setLineDash([6,4]);
  cCtx.beginPath();
  cCtx.moveTo(cropPath[0].x,cropPath[0].y);
  for(let i=1;i<cropPath.length;i++){
    cCtx.lineTo(cropPath[i].x,cropPath[i].y);
  }
  cCtx.closePath();cCtx.stroke();cCtx.setLineDash([]);
}

// 触屏事件
cCanvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(cropClosed)return;
  cropDrawing=true;cropClosed=false;
  cropPath=[getCPos(e)];
  cCtx.clearRect(0,0,cCanvas.width,cCanvas.height);
  chint.textContent='继续画…';
},{passive:false});

cCanvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(!cropDrawing)return;
  cropPath.push(getCPos(e));
  drawStroke(); // 画线时只显示笔迹
},{passive:false});

cCanvas.addEventListener('touchend',e=>{
  e.preventDefault();
  if(!cropDrawing)return;
  cropDrawing=false;
  if(cropPath.length>8){
    // 自动闭合：最后一点连回起点
    cropPath.push({...cropPath[0]});
    cropClosed=true;
    drawSelectionOverlay();
    chint.textContent='满意就点「完成」，不满意点「重选」';
  } else {
    clearCropPath();
    chint.textContent='划得太短了，请重新圈选';
  }
},{passive:false});

// 鼠标支持（桌面调试用）
cCanvas.addEventListener('mousedown',e=>{if(cropClosed)return;cropDrawing=true;cropPath=[getCPos(e)];cCtx.clearRect(0,0,cCanvas.width,cCanvas.height);});
cCanvas.addEventListener('mousemove',e=>{if(!cropDrawing)return;cropPath.push(getCPos(e));drawStroke();});
cCanvas.addEventListener('mouseup',()=>{
  if(!cropDrawing)return;cropDrawing=false;
  if(cropPath.length>4){cropPath.push({...cropPath[0]});cropClosed=true;drawSelectionOverlay();chint.textContent='满意就点「完成」，不满意点「重选」';}
  else clearCropPath();
});

function confirmCrop(){
  if(!cropClosed||cropPath.length<3){chint.textContent='请先圈出选区再确认';return;}
  const xs=cropPath.map(p=>p.x),ys=cropPath.map(p=>p.y);
  const minX=Math.min(...xs),minY=Math.min(...ys);
  const w=Math.round(Math.max(...xs)-minX),h=Math.round(Math.max(...ys)-minY);
  if(w<10||h<10){chint.textContent='选区太小，请重新圈选';clearCropPath();return;}
  const off=document.createElement('canvas');off.width=w;off.height=h;
  const oc=off.getContext('2d');
  oc.beginPath();
  oc.moveTo(cropPath[0].x-minX,cropPath[0].y-minY);
  for(let i=1;i<cropPath.length;i++) oc.lineTo(cropPath[i].x-minX,cropPath[i].y-minY);
  oc.closePath();oc.clip();
  const ar=document.getElementById('crop-area').getBoundingClientRect();
  const ir=cSrc.getBoundingClientRect();
  oc.drawImage(cSrc,ir.left-ar.left-minX,ir.top-ar.top-minY,ir.width,ir.height);
  addToStash(off.toDataURL('image/png'),w,h);
  if(cropTrayItem)cropTrayItem.classList.add('cropped');
  clearCropPath();
  chint.textContent='✅ 已存入素材库！';
  setTimeout(()=>chint.textContent='按住拖动圈出选区，松手自动闭合',2000);
}

// ═══════════════════════════════════════════════
// 素材库
// ═══════════════════════════════════════════════
function addToStash(src,nw,nh){
  const list=document.getElementById('stash-list');
  const empty=document.getElementById('stash-empty');if(empty)empty.remove();
  const item=document.createElement('div');item.className='si';item.dataset.w=nw||100;item.dataset.h=nh||100;
  const img=document.createElement('img');img.src=src;item.appendChild(img);
  const sd=document.createElement('button');sd.className='sdel';sd.textContent='×';
  sd.addEventListener('click',e=>{e.stopPropagation();item.remove();});item.appendChild(sd);
  item.addEventListener('click',()=>{const sc=0.45,pw=Math.min(nw*sc,CC.offsetWidth*0.45),ph2=nh*(pw/nw);_placeOnCanvas(src,pw,ph2);setMode('move');});
  list.appendChild(item);
}

// ═══════════════════════════════════════════════
// 分析页面
// ═══════════════════════════════════════════════
let calY = new Date().getFullYear(), calM = new Date().getMonth();

function openAnalytics(){
  const ov = document.getElementById('analytics-ov');
  ov.classList.add('show');
  refreshAnalytics();
}
function closeAnalytics(){
  document.getElementById('analytics-ov').classList.remove('show');
}

function refreshAnalytics(){
  const now = new Date(), yr = now.getFullYear();
  const allPages = trips.flatMap(t => t.pages||[]);
  const yrE = allPages.filter(p => new Date(p.dateTs).getFullYear() === yr);
  const uniqueDays = new Set(yrE.map(p => new Date(p.dateTs).toDateString())).size;
  const totalPhotos = allPages.reduce((s,p) => s + (p.trayPhotos ? p.trayPhotos.length : 0), 0);

  document.getElementById('an-big-num').textContent = yrE.length;
  document.getElementById('an-stat-days').textContent = uniqueDays;
  document.getElementById('an-stat-photos').textContent = totalPhotos;
  document.getElementById('an-stat-total').textContent = allPages.length;

  // 折线图
  const counts = Array(12).fill(0);
  yrE.forEach(e => counts[new Date(e.dateTs).getMonth()]++);
  const max = Math.max(...counts, 1);
  const pts = counts.map((v,i) => {
    const x = 10 + i * (220/11);
    const y = 65 - (v/max)*58;
    return x+','+y;
  }).join(' ');
  document.getElementById('an-chart').innerHTML =
    `<polyline points="${pts}" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>` +
    counts.map((v,i)=>{
      if(!v) return '';
      const x=10+i*(220/11), y=65-(v/max)*58;
      return `<circle cx="${x}" cy="${y}" r="3" fill="#fff"/>`;
    }).join('');

  // 连续纪录
  const streak = calcStreak();
  document.getElementById('streak-count').style.display = streak > 0 ? 'block' : 'none';
  document.getElementById('streak-unit').style.display = streak > 0 ? 'block' : 'none';
  document.getElementById('streak-empty').style.display = streak > 0 ? 'none' : 'block';
  if(streak > 0) document.getElementById('streak-count').textContent = streak;

  // 日历
  calY = yr; calM = now.getMonth();
  renderCal();
}

function calcStreak(){
  const allPages=trips.flatMap(t=>t.pages||[]);
  if(!allPages.length) return 0;
  const days = [...new Set(allPages.map(e=>new Date(e.dateTs).toDateString()))]
    .map(s=>new Date(s)).sort((a,b)=>b-a);
  const tod = new Date().toDateString();
  const yes = new Date(Date.now()-86400000).toDateString();
  if(days[0].toDateString()!==tod && days[0].toDateString()!==yes) return 0;
  let s=1;
  for(let i=1;i<days.length;i++){
    if(Math.round((days[i-1]-days[i])/86400000)===1) s++;
    else break;
  }
  return s;
}

function renderCal(){
  document.getElementById('an-cal-title').textContent = `${calY}年${calM+1}月`;
  const allPages=trips.flatMap(t=>t.pages||[]);
  const entryDays = new Set(
    allPages.filter(p=>{const d=new Date(p.dateTs);return d.getFullYear()===calY&&d.getMonth()===calM;})
            .map(p=>new Date(p.dateTs).getDate())
  );
  const tod = new Date(), todY=tod.getFullYear(), todM=tod.getMonth(), todD=tod.getDate();
  const first = new Date(calY,calM,1).getDay();
  const last  = new Date(calY,calM+1,0).getDate();
  let html='';
  for(let i=0;i<first;i++) html+=`<div class="cday blank">·</div>`;
  for(let d=1;d<=last;d++){
    const isToday = calY===todY&&calM===todM&&d===todD;
    const hasEntry = entryDays.has(d);
    let cls='cday';
    if(hasEntry) cls+=' has';
    if(isToday)  cls+=' tod';
    html+=`<div class="${cls}">${d}</div>`;
  }
  document.getElementById('an-cal-grid').innerHTML=html;
}

function calShift(dir){
  calM+=dir;
  if(calM<0){calM=11;calY--;}
  if(calM>11){calM=0;calY++;}
  renderCal();
}

showHome();
